name: SAM.gov opportunities two-hour check

# Mirrors SAM.gov's public daily ContractOpportunitiesFullCSV.csv into the D1
# database behind the hosted SAM.gov MCP (sam.1102tools.com). Only changed
# notices are written; the loader refuses files with changed columns or far
# fewer notices than the database. Never deploys the Worker.
#
# Credential: the sam-data-load environment (main only) holds
# CLOUDFLARE_D1_TOKEN, a Cloudflare API token limited to D1 edit on this
# account. The release credential in cloudflare-production stays tag-only.

on:
  schedule:
    - cron: '15 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sam-opportunities-load
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # A failure alerts through outage-alert.yml (with backoff), not by failing the run.
    continue-on-error: true
    environment: sam-data-load
    env:
      CLOUDFLARE_ACCOUNT_ID: 846d3e41e48446abcd3570c0959f9fb5
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Check credential
        run: test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Add CLOUDFLARE_D1_TOKEN to the sam-data-load environment'; exit 1; }
      - name: Install wrangler
        run: npm ci --prefix deploy/sam-gov --ignore-scripts
      - name: Load the latest SAM.gov file into D1
        run: |
          python scripts/load_sam_opportunities.py --remote > status.json
          { echo '```json'; cat status.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  alert:
    needs: load
    if: ${{ !cancelled() }}
    permissions:
      actions: read
      contents: read
      issues: write
    uses: ./.github/workflows/outage-alert.yml
    with:
      title: SAM.gov opportunities load failing
