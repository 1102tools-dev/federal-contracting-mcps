name: GSA Per Diem data load

# Loads the gsa-perdiem-mcp package's bundled GSA files into the D1 database
# behind the hosted GSA Per Diem MCP (gsa-perdiem.1102tools.com). The loader
# writes only parts that changed, verifies their row counts, and then
# switches readers to the new release in one statement; re-running is a
# no-op. Never deploys the Worker.
#
# Runs when the bundled data, the loader, or the schema changes on main, on
# demand, and from the bundled data refresh (its bot push does not trigger
# push workflows, so it dispatches this one and waits).
#
# Credential: the sam-data-load environment (main only) holds
# CLOUDFLARE_D1_TOKEN, a Cloudflare API token limited to D1 edit on this
# account. The database id comes from deploy/gsa-perdiem/wrangler.jsonc.

on:
  push:
    branches: [main]
    paths:
      - 'servers/gsa-perdiem-mcp/src/gsa_perdiem_mcp/data/**'
      - 'scripts/load_gsa_perdiem.py'
      - 'deploy/gsa-perdiem/schema.sql'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gsa-perdiem-load
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: sam-data-load
    env:
      CLOUDFLARE_ACCOUNT_ID: 846d3e41e48446abcd3570c0959f9fb5
      CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check credential and database
        run: |
          test -n "$CLOUDFLARE_D1_TOKEN" || { echo 'Add CLOUDFLARE_D1_TOKEN to the sam-data-load environment'; exit 1; }
          id=$(python -c 'import json; print(json.load(open("deploy/gsa-perdiem/wrangler.jsonc"))["env"]["production"]["d1_databases"][0]["database_id"])')
          case "$id" in REPLACE_*|'') echo 'Set the D1 database_id in deploy/gsa-perdiem/wrangler.jsonc'; exit 1;; esac
          echo "GSA_PERDIEM_D1_DATABASE_ID=$id" >> "$GITHUB_ENV"
      - name: Load the bundled GSA files into D1
        run: |
          python scripts/load_gsa_perdiem.py --remote > status.json
          { echo '```json'; cat status.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
