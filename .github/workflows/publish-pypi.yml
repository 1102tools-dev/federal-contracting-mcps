name: Release MCP packages and hosted services

# Publishes every server package to PyPI on tag push via OIDC Trusted Publisher.
# Each server must have a Trusted Publisher configured at
# https://pypi.org/manage/project/<pkg>/settings/publishing/ pointing at
# this repo and this workflow filename.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: mcp-production-release
  cancel-in-progress: false

jobs:
  shared-safety-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        filelock: ["filelock==3.13.1", "filelock"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Verify synchronized pacing helpers
        run: python scripts/sync_pacing.py --check

      - name: Run shared offline safety tests
        run: >-
          uv run --with pytest --with pytest-asyncio --with httpx
          --with "${{ matrix.filelock }}" --with platformdirs
          pytest -q tests/test_federal_api_pacing.py

      - name: Test release safeguards
        run: uv run --with pytest --with packaging --with pyyaml pytest -q tests/test_release_guards.py

      - name: Verify version surfaces
        run: python scripts/validate_versions.py

  test-and-build:
    needs: shared-safety-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server:
          - { dir: "acquisition-gov-mcp", pkg: "acquisition-gov-mcp" }
          - { dir: "bls-oews-mcp",        pkg: "bls-oews-mcp" }
          - { dir: "ecfr-mcp",            pkg: "ecfr-mcp" }
          - { dir: "federal-register-mcp", pkg: "federal-register-mcp" }
          - { dir: "gsa-calc-mcp",        pkg: "gsa-calc-mcp" }
          - { dir: "gsa-perdiem-mcp",     pkg: "gsa-perdiem-mcp" }
          - { dir: "regulations-gov-mcp", pkg: "regulationsgov-mcp" }
          - { dir: "sam-gov-mcp",         pkg: "sam-gov-mcp" }
          - { dir: "usaspending-gov-mcp", pkg: "usaspending-gov-mcp" }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Run offline package tests
        working-directory: servers/${{ matrix.server.dir }}
        env:
          FEDERAL_API_MIN_INTERVAL_SECONDS: '0'
          MCP_LIVE_TESTS: '0'
          BLS_LIVE_TESTS: '0'
          ECFR_LIVE_TESTS: '0'
          FR_LIVE_TESTS: '0'
          GSA_CALC_LIVE_TESTS: '0'
          REGULATIONS_LIVE_TESTS: '0'
          SAM_LIVE_TESTS: '0'
          USASPENDING_LIVE_TESTS: '0'
          ACQUISITION_GOV_LIVE_TESTS: '0'
        run: uv run pytest -q

      - name: Install build tooling
        run: pip install --upgrade build packaging

      - name: Build sdist + wheel
        working-directory: servers/${{ matrix.server.dir }}
        run: python -m build

      - name: Verify pacing helper is packaged
        working-directory: servers/${{ matrix.server.dir }}
        run: unzip -l dist/*.whl | grep '_pacing.py'

      - name: Reject changed packages using an existing PyPI version
        run: python scripts/check_published_version.py servers/${{ matrix.server.dir }}

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.server.pkg }}
          path: servers/${{ matrix.server.dir }}/dist/

  publish:
    needs: [test-and-build, hosted-build, cloudflare-access, deploy-hosted]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server:
          - { dir: "acquisition-gov-mcp", pkg: "acquisition-gov-mcp" }
          - { dir: "bls-oews-mcp",        pkg: "bls-oews-mcp" }
          - { dir: "ecfr-mcp",            pkg: "ecfr-mcp" }
          - { dir: "federal-register-mcp", pkg: "federal-register-mcp" }
          - { dir: "gsa-calc-mcp",        pkg: "gsa-calc-mcp" }
          - { dir: "gsa-perdiem-mcp",     pkg: "gsa-perdiem-mcp" }
          - { dir: "regulations-gov-mcp", pkg: "regulationsgov-mcp" }
          - { dir: "sam-gov-mcp",         pkg: "sam-gov-mcp" }
          - { dir: "usaspending-gov-mcp", pkg: "usaspending-gov-mcp" }
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ matrix.server.pkg }}
          path: dist/

      - name: Publish to PyPI (${{ matrix.server.pkg }})
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

      - name: Verify actual published package matches the built wheel
        run: uv run --with packaging python scripts/check_published_version.py servers/${{ matrix.server.dir }} --dist dist --require-published

  publish-registry:
    needs: publish
    runs-on: ubuntu-latest
    environment: mcp-registry-publish
    env:
      MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned MCP publisher
        run: |
          curl -fsSLO https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher_linux_amd64.tar.gz" | sha256sum --check
          mkdir -p "${RUNNER_TEMP}/mcp-publisher"
          tar -xzf mcp-publisher_linux_amd64.tar.gz -C "${RUNNER_TEMP}/mcp-publisher"
          echo "${RUNNER_TEMP}/mcp-publisher" >> "${GITHUB_PATH}"

      - name: Authenticate the com.1102tools namespace
        run: mcp-publisher login http --domain 1102tools.com --private-key "${MCP_PRIVATE_KEY}"

      - name: Validate and publish all nine servers
        run: |
          for manifest in servers/*/server.json; do
            mcp-publisher validate "${manifest}"
            if output=$(mcp-publisher publish "${manifest}" 2>&1); then
              printf '%s\n' "${output}"
            elif grep -Fq 'invalid version: cannot publish duplicate version' <<<"${output}"; then
              echo "Registry already contains $(basename "$(dirname "${manifest}")"); skipping unchanged version."
            else
              printf '%s\n' "${output}" >&2
              exit 1
            fi
          done

  # Bundles were dropped in 1.0.0, and the .mcpb workflow was what used to
  # create the GitHub Release. This keeps a Release (notes only, no assets)
  # for every tag so the Releases page stays the changelog landing spot.
  release:
    needs: [publish, deploy-hosted, publish-registry]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: "PyPI packages, the MCP registry, and all five hosted services completed this release from the same commit. See the workflow summary for deployment verification."

  hosted-build:
    needs: shared-safety-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        slug: [usaspending, ecfr, gsa-calc, federal-register, acquisition-gov]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check hosted package contract
        env:
          SLUG: ${{ matrix.slug }}
        run: |
          PACKAGE=$(python -c 'import json,os; print(json.load(open("deploy/services.json"))[os.environ["SLUG"]]["package"])')
          uv run --python 3.12 --frozen --project "servers/$PACKAGE" python scripts/check_hosted_contract.py "$SLUG"
      - name: Validate Worker and build exact release image
        env:
          SLUG: ${{ matrix.slug }}
        run: |
          npm ci --prefix "deploy/$SLUG" --ignore-scripts
          npm run check --prefix "deploy/$SLUG"
          docker build --platform linux/amd64 --build-arg RELEASE_SHA="$GITHUB_SHA" -f "deploy/$SLUG/Dockerfile" -t "$SLUG-mcp:$GITHUB_SHA" .
          docker run -d --name mcp-release-check -p 8080:8080 -e MCP_ALLOWED_HOSTS=localhost:*,127.0.0.1:* "$SLUG-mcp:$GITHUB_SHA"
          python scripts/verify_hosted_release.py "$SLUG" --sha "$GITHUB_SHA" --base http://localhost:8080 --no-upstream
          docker save "$SLUG-mcp:$GITHUB_SHA" -o image.tar
      - name: Stop validation container
        if: always()
        run: docker rm -f mcp-release-check || true
      - uses: actions/upload-artifact@v4
        with:
          name: hosted-${{ matrix.slug }}
          path: image.tar
          retention-days: 14

  deploy-hosted:
    needs: [test-and-build, hosted-build, cloudflare-access]
    runs-on: ubuntu-latest
    environment: cloudflare-production
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        slug: [usaspending, ecfr, gsa-calc, federal-register, acquisition-gov]
    env:
      CLOUDFLARE_ACCOUNT_ID: 846d3e41e48446abcd3570c0959f9fb5
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SLUG: ${{ matrix.slug }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: hosted-${{ matrix.slug }}
      - name: Deploy verified image to existing service
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing Cloudflare deployment credential'; exit 1; }
          export DOCKER_CONFIG="$RUNNER_TEMP/cloudflare-docker"
          mkdir -m 700 -p "$DOCKER_CONFIG"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          docker load -i image.tar
          npm ci --prefix "deploy/$SLUG" --ignore-scripts
          python scripts/configure_hosted_image.py "$SLUG" "$GITHUB_SHA"
          APPLICATION_ID=$(python -c 'import json,os; print(json.load(open("deploy/services.json"))[os.environ["SLUG"]]["application_id"])')
          cd "deploy/$SLUG"
          npx wrangler deployments list --config wrangler.release.json --env production > previous-worker.txt
          npx wrangler containers info "$APPLICATION_ID" > previous-container.json
          npx wrangler containers push "$SLUG-mcp:$GITHUB_SHA"
          npx wrangler deploy --config wrangler.release.json --env production
      - name: Verify production code and repeated upstream requests
        run: python scripts/verify_hosted_release.py "$SLUG" --sha "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: previous-${{ matrix.slug }}
          path: deploy/${{ matrix.slug }}/previous-*
          retention-days: 30
      - name: Record service outcome
        if: always()
        env:
          OUTCOME: ${{ job.status }}
        run: echo "### $SLUG — $OUTCOME — $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  release-summary:
    needs: [publish, deploy-hosted, publish-registry]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report each destination independently
        env:
          PYPI: ${{ needs.publish.result }}
          HOSTED: ${{ needs.deploy-hosted.result }}
          REGISTRY: ${{ needs.publish-registry.result }}
        run: |
          printf '## Release %s\n\n| Destination | Result |\n|---|---|\n| PyPI | %s |\n| Cloudflare | %s |\n| MCP registry | %s |\n' "$GITHUB_SHA" "$PYPI" "$HOSTED" "$REGISTRY" >> "$GITHUB_STEP_SUMMARY"
          test "$PYPI/$HOSTED/$REGISTRY" = success/success/success

  cloudflare-access:
    runs-on: ubuntu-latest
    environment: cloudflare-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 846d3e41e48446abcd3570c0959f9fb5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check deployment credential before either destination publishes
        run: |
          [[ "$GITHUB_REF" == refs/tags/v* ]] || { echo 'Dispatch this workflow on a versioned release tag'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Configure the cloudflare-production environment credential before releasing'; exit 1; }
          npx --yes wrangler@4.129.1 containers list
