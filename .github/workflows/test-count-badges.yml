name: Test-count badges

# Counts each package's regression tests with pytest collection and writes
# shields.io endpoint files to badges/. badges/** is not a trigger, so the
# bot commit below cannot start another run.
on:
  push:
    branches: [main]
    paths:
      - 'servers/**'
      - '.github/workflows/test-count-badges.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: test-count-badges
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Count tests and write badge files
        env:
          UV_PYTHON: '3.12'
          FEDERAL_API_MIN_INTERVAL_SECONDS: '0'
          MCP_LIVE_TESTS: '0'
          BLS_LIVE_TESTS: '0'
          ECFR_LIVE_TESTS: '0'
          FR_LIVE_TESTS: '0'
          GSA_CALC_LIVE_TESTS: '0'
          REGULATIONS_LIVE_TESTS: '0'
          SAM_LIVE_TESTS: '0'
          USASPENDING_LIVE_TESTS: '0'
          ACQUISITION_GOV_LIVE_TESTS: '0'
        run: |
          set -euo pipefail
          counts="$(mktemp)"
          for project in servers/*/; do
            dir="$(basename "$project")"
            test -f "servers/$dir/pyproject.toml" || continue
            out="$(cd "servers/$dir" && uv run --frozen --project . pytest --collect-only -q)"
            n="$(printf '%s\n' "$out" | grep -Eo '[0-9]+ tests? collected' | tail -n 1 | grep -Eo '^[0-9]+')"
            test -n "$n"
            echo "$dir $n"
            echo "$dir $n" >> "$counts"
          done
          python3 - "$counts" <<'PY'
          import json, pathlib, sys

          rows = [line.split() for line in pathlib.Path(sys.argv[1]).read_text().splitlines() if line.strip()]
          if len(rows) != 9:
              sys.exit(f"expected 9 packages, found {len(rows)}")
          out = pathlib.Path("badges")
          out.mkdir(exist_ok=True)

          def write(name, n):
              data = {"schemaVersion": 1, "label": "regression tests", "message": f"{n:,}", "color": "007a59"}
              (out / name).write_text(json.dumps(data) + "\n")

          total = 0
          for name, n in rows:
              write(f"tests-{name}.json", int(n))
              total += int(n)
          write("tests-total.json", total)
          print(f"total {total:,}")
          PY
      - name: Commit changed badge files
        run: |
          git add badges
          if git diff --cached --quiet; then
            echo "Badge counts unchanged."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update test-count badges [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
