[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "regulationsgov-mcp"
version = "1.0.7"
description = "MCP server for the Regulations.gov API. Federal rulemaking dockets, documents, comments, and comment period tracking."
readme = "readme.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "James Jenrette / 1102tools" }
]
keywords = ["mcp", "model-context-protocol", "regulations", "rulemaking", "far", "dockets", "comments", "1102"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "mcp>=2.0.0,<3",
    "httpx>=0.27.0",
    "filelock>=3.13",
    "platformdirs>=4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
]

[project.urls]
Homepage = "https://1102tools.com"
Repository = "https://github.com/1102tools-dev/federal-contracting-mcps"
Issues = "https://github.com/1102tools-dev/federal-contracting-mcps/issues"

[project.scripts]
regulationsgov-mcp = "regulationsgov_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/regulationsgov_mcp"]
