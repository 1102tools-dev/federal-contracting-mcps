[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acquisition-gov-mcp"
version = "1.0.0"
description = "Deterministic MCP access to Acquisition.gov FAR Overhaul model text, guidance, and posted agency deviations."
readme = "readme.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "James Jenrette / 1102tools" }]
keywords = ["mcp", "acquisition.gov", "far-overhaul", "rfo", "class-deviation", "1102"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "filelock>=3.13",
    "httpx>=0.27",
    "mcp>=2,<3",
    "platformdirs>=4",
    "pypdf>=5,<7",
]

[project.urls]
Homepage = "https://1102tools.com"
Repository = "https://github.com/1102tools/federal-contracting-mcps"
Issues = "https://github.com/1102tools/federal-contracting-mcps/issues"

[project.scripts]
acquisition-gov-mcp = "acquisition_gov_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "reportlab>=4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/acquisition_gov_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

