name: Acquisition.gov constrained runtime check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build -f deploy/acquisition-gov/Dockerfile -t acquisition-runtime-check .
      - name: Exercise real PDF with hosted CPU and memory limits
        run: |
          docker run --rm --network none --cpus 0.0625 --memory 256m \
            -v "$PWD/servers/acquisition-gov-mcp/tests/fixtures:/fixtures:ro" \
            acquisition-runtime-check /app/.venv/bin/python -c '
          import asyncio,json,time,resource
          from pathlib import Path
          from acquisition_gov_mcp.server import _read_pdf_safely
          async def main():
              body=Path("/fixtures/nsf-part1-2026-09-13.pdf").read_bytes()
              for iteration in range(2):
                  start=time.monotonic()
                  result=await _read_pdf_safely(body,page_start=1,page_end=2)
                  print(json.dumps({"iteration":iteration+1,"seconds":round(time.monotonic()-start,3),"status":result[1],"pages":result[4],"warnings":result[2],"parent_peak_rss_kib":resource.getrusage(resource.RUSAGE_SELF).ru_maxrss}),flush=True)
                  assert result[1]=="complete" and result[4]==3
          asyncio.run(main())'
