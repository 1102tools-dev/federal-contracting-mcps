name: Hosted service health

# Every 30 minutes, check each hosted MCP service end to end (health,
# initialize, one upstream tool call, publisher-key mode, and for GSA Per Diem
# a rotating GSA API city lookup that usually misses the response cache and
# so exercises the publisher key). Opens or updates one
# issue while anything fails and closes it when all services recover.
# Read-only: never deploys or changes a service.

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: hosted-health
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check every hosted service
        id: check
        run: |
          set +e
          python scripts/check_hosted_health.py > report.md
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat report.md | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Open, update, or close the outage issue
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.check.outputs.status }}
        run: |
          title="Hosted MCP service health check failing"
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ "$STATUS" != "0" ]; then
            if [ -n "$number" ]; then gh issue comment "$number" --body-file report.md
            else gh issue create --title "$title" --body-file report.md; fi
            exit 1
          elif [ -n "$number" ]; then
            gh issue comment "$number" --body "All hosted services passed again. $(date -u +%FT%TZ)"
            gh issue close "$number"
          fi
