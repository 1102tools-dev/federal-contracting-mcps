name: Release MCP packages and hosted services

# Builds, deploys (Cloudflare first, verified), and publishes (PyPI via OIDC
# Trusted Publishing, MCP Registry, GitHub Release) from one tagged commit.
# `v*` tags release every package and hosted service; `<slug>/v<version>` tags
# release one hosted service and its package (scripts/release_plan.py).
# Each package must have a Trusted Publisher at
# https://pypi.org/manage/project/<pkg>/settings/publishing/ pointing at
# this repo and this workflow filename.

on:
  push:
    tags:
      # v1.2.3 releases everything; gsa-perdiem/v1.1.0 releases one service.
      - 'v*'
      - '*/v*'
  workflow_dispatch:
    inputs:
      services:
        description: 'Hosted services to release: "all", or comma-separated slugs from deploy/services.json (e.g. gsa-perdiem). Dispatch on a release tag.'
        required: false
        default: all

concurrency:
  group: mcp-production-release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      hosted: ${{ steps.plan.outputs.hosted }}
      packages: ${{ steps.plan.outputs.packages }}
      manifests: ${{ steps.plan.outputs.manifests }}
      scope: ${{ steps.plan.outputs.scope }}
      release_body: ${{ steps.plan.outputs.release_body }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Compute release scope
        id: plan
        env:
          SERVICES: ${{ github.event.inputs.services || 'all' }}
        run: python3 scripts/release_plan.py --services "$SERVICES" --ref "$GITHUB_REF"

  shared-safety-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        filelock: ["filelock==3.13.1", "filelock"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Setup uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Verify synchronized pacing helpers
        run: python scripts/sync_pacing.py --check

      - name: Run shared offline safety tests
        run: >-
          uv run --with pytest --with pytest-asyncio --with httpx
          --with "${{ matrix.filelock }}" --with platformdirs --with starlette
          pytest -q tests/test_federal_api_pacing.py tests/test_hosted_admission.py

      - name: Test release safeguards
        run: uv run --with pytest --with packaging --with pyyaml pytest -q tests/test_release_guards.py

      - name: Verify version surfaces
        run: python scripts/validate_versions.py

  test-and-build:
    needs: [plan, shared-safety-tests]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server: ${{ fromJSON(needs.plan.outputs.packages) }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Setup uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Run offline package tests
        working-directory: servers/${{ matrix.server.dir }}
        env:
          FEDERAL_API_MIN_INTERVAL_SECONDS: '0'
          MCP_LIVE_TESTS: '0'
          BLS_LIVE_TESTS: '0'
          ECFR_LIVE_TESTS: '0'
          FR_LIVE_TESTS: '0'
          GSA_CALC_LIVE_TESTS: '0'
          REGULATIONS_LIVE_TESTS: '0'
          SAM_LIVE_TESTS: '0'
          USASPENDING_LIVE_TESTS: '0'
          ACQUISITION_GOV_LIVE_TESTS: '0'
        run: uv run pytest -q

      - name: Install build tooling
        run: pip install --upgrade build packaging

      - name: Build sdist + wheel
        working-directory: servers/${{ matrix.server.dir }}
        run: python -m build

      - name: Verify pacing helper is packaged
        working-directory: servers/${{ matrix.server.dir }}
        run: unzip -l dist/*.whl | grep '_pacing.py'

      - name: Verify bundled per diem data is packaged
        if: matrix.server.dir == 'gsa-perdiem-mcp'
        working-directory: servers/${{ matrix.server.dir }}
        run: |
          unzip -l dist/*.whl | grep 'gsa_perdiem_mcp/data/manifest.json'
          unzip -l dist/*.whl | grep 'gsa_perdiem_mcp/data/places.json.gz'
          unzip -l dist/*.whl | grep -E 'gsa_perdiem_mcp/data/fy[0-9]{4}\.json\.gz'

      - name: Reject changed packages using an existing PyPI version
        run: python scripts/check_published_version.py servers/${{ matrix.server.dir }}

      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-${{ matrix.server.pkg }}
          path: servers/${{ matrix.server.dir }}/dist/

  publish:
    needs: [plan, test-and-build, hosted-build, cloudflare-access, deploy-hosted]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server: ${{ fromJSON(needs.plan.outputs.packages) }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-${{ matrix.server.pkg }}
          path: dist/

      - name: Publish to PyPI (${{ matrix.server.pkg }})
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
          skip-existing: true

      - name: Verify actual published package matches the built wheel
        run: uv run --with packaging python scripts/check_published_version.py servers/${{ matrix.server.dir }} --dist dist --require-published

  publish-registry:
    needs: [plan, publish]
    runs-on: ubuntu-latest
    environment: mcp-registry-publish
    env:
      MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
      MANIFESTS: ${{ needs.plan.outputs.manifests }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pinned MCP publisher
        run: |
          curl -fsSLO https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher_linux_amd64.tar.gz" | sha256sum --check
          mkdir -p "${RUNNER_TEMP}/mcp-publisher"
          tar -xzf mcp-publisher_linux_amd64.tar.gz -C "${RUNNER_TEMP}/mcp-publisher"
          echo "${RUNNER_TEMP}/mcp-publisher" >> "${GITHUB_PATH}"

      - name: Authenticate the com.1102tools namespace
        run: mcp-publisher login http --domain 1102tools.com --private-key "${MCP_PRIVATE_KEY}"

      - name: Validate and publish the servers in this release
        run: |
          for manifest in $MANIFESTS; do
            mcp-publisher validate "${manifest}"
            if output=$(mcp-publisher publish "${manifest}" 2>&1); then
              printf '%s\n' "${output}"
            elif grep -Fq 'invalid version: cannot publish duplicate version' <<<"${output}"; then
              echo "Registry already contains $(basename "$(dirname "${manifest}")"); skipping unchanged version."
            else
              printf '%s\n' "${output}" >&2
              exit 1
            fi
          done

  # Bundles were dropped in 1.0.0, and the .mcpb workflow was what used to
  # create the GitHub Release. This keeps a Release (notes only, no assets)
  # for every tag so the Releases page stays the changelog landing spot.
  release:
    needs: [plan, publish, deploy-hosted, publish-registry]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          body: ${{ needs.plan.outputs.release_body }}
          # A one-service release must not become the repository's "Latest" release.
          make_latest: ${{ needs.plan.outputs.scope == 'all' && 'true' || 'false' }}

  hosted-build:
    needs: [plan, shared-safety-tests]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        slug: ${{ fromJSON(needs.plan.outputs.hosted) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Check hosted package contract
        env:
          SLUG: ${{ matrix.slug }}
        run: |
          PACKAGE=$(python -c 'import json,os; print(json.load(open("deploy/services.json"))[os.environ["SLUG"]]["package"])')
          uv run --python 3.12 --frozen --project "servers/$PACKAGE" python scripts/check_hosted_contract.py "$SLUG"
      - name: Validate Worker and build exact release image
        env:
          SLUG: ${{ matrix.slug }}
        run: |
          npm ci --prefix "deploy/$SLUG" --ignore-scripts
          npm run check --prefix "deploy/$SLUG"
          docker build --platform linux/amd64 --build-arg RELEASE_SHA="$GITHUB_SHA" -f "deploy/$SLUG/Dockerfile" -t "$SLUG-mcp:$GITHUB_SHA" .
          # Operator-keyed images refuse to start without their key; a placeholder
          # satisfies that for this no-upstream check (the real key is a Worker secret).
          docker run -d --name mcp-release-check -p 8080:8080 -e MCP_ALLOWED_HOSTS=localhost:*,127.0.0.1:* \
            -e PERDIEM_API_KEY=release-check-placeholder -e REGULATIONS_GOV_API_KEY=release-check-placeholder \
            "$SLUG-mcp:$GITHUB_SHA"
          python scripts/verify_hosted_release.py "$SLUG" --sha "$GITHUB_SHA" --base http://localhost:8080 --no-upstream
          docker save "$SLUG-mcp:$GITHUB_SHA" -o image.tar
      - name: Stop validation container
        if: always()
        run: docker rm -f mcp-release-check || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hosted-${{ matrix.slug }}
          path: image.tar
          retention-days: 14

  deploy-hosted:
    needs: [plan, test-and-build, hosted-build, cloudflare-access]
    runs-on: ubuntu-latest
    environment: cloudflare-production
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        slug: ${{ fromJSON(needs.plan.outputs.hosted) }}
    env:
      CLOUDFLARE_ACCOUNT_ID: 846d3e41e48446abcd3570c0959f9fb5
      SLUG: ${{ matrix.slug }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: hosted-${{ matrix.slug }}
      - name: Deploy verified image to existing service
        # The deploy credential is visible only to this step, not to every action in the job.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing Cloudflare deployment credential'; exit 1; }
          export DOCKER_CONFIG="$RUNNER_TEMP/cloudflare-docker"
          mkdir -m 700 -p "$DOCKER_CONFIG"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          docker load -i image.tar
          npm ci --prefix "deploy/$SLUG" --ignore-scripts
          python scripts/configure_hosted_image.py "$SLUG" "$GITHUB_SHA"
          APPLICATION_ID=$(python -c 'import json,os; print(json.load(open("deploy/services.json"))[os.environ["SLUG"]]["application_id"])')
          cd "deploy/$SLUG"
          npx wrangler deployments list --config wrangler.release.json --env production > previous-worker.txt
          npx wrangler containers info "$APPLICATION_ID" > previous-container.json
          npx wrangler containers push "$SLUG-mcp:$GITHUB_SHA"
          npx wrangler deploy --config wrangler.release.json --env production
      - name: Verify production code and repeated upstream requests
        run: python scripts/verify_hosted_release.py "$SLUG" --sha "$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: previous-${{ matrix.slug }}
          path: deploy/${{ matrix.slug }}/previous-*
          retention-days: 30
      - name: Record service outcome
        if: always()
        env:
          OUTCOME: ${{ job.status }}
        run: echo "### $SLUG — $OUTCOME — $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  release-summary:
    needs: [plan, publish, deploy-hosted, publish-registry]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report each destination independently
        env:
          SCOPE: ${{ needs.plan.outputs.scope }}
          PYPI: ${{ needs.publish.result }}
          HOSTED: ${{ needs.deploy-hosted.result }}
          REGISTRY: ${{ needs.publish-registry.result }}
        run: |
          printf '## Release %s (scope: %s)\n\n| Destination | Result |\n|---|---|\n| PyPI | %s |\n| Cloudflare | %s |\n| MCP registry | %s |\n' "$GITHUB_SHA" "$SCOPE" "$PYPI" "$HOSTED" "$REGISTRY" >> "$GITHUB_STEP_SUMMARY"
          test "$PYPI/$HOSTED/$REGISTRY" = success/success/success

  cloudflare-access:
    runs-on: ubuntu-latest
    environment: cloudflare-production
    env:
      CLOUDFLARE_ACCOUNT_ID: 846d3e41e48446abcd3570c0959f9fb5
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Check deployment credential before either destination publishes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          [[ "$GITHUB_REF" =~ ^refs/tags/([a-z0-9-]+/)?v[0-9] ]] || { echo 'Dispatch this workflow on a versioned release tag'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Configure the cloudflare-production environment credential before releasing'; exit 1; }
          npx --yes wrangler@4.129.1 containers list
