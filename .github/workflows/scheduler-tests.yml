name: Scheduler tests

# The scheduler Worker's typecheck, tests and deploy dry run on every PR that
# touches it, so a break shows up in review instead of at release time.
# scheduler-release.yml runs the same checks again before it deploys.

on:
  pull_request:
    paths:
      - 'deploy/scheduler/**'
      - '.github/workflows/scheduler-tests.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/scheduler/**'
      - '.github/workflows/scheduler-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Typecheck, tests, and deploy dry run
        working-directory: deploy/scheduler
        run: |
          npm ci --ignore-scripts
          npm run check
          npm test
          npm run dry-run
