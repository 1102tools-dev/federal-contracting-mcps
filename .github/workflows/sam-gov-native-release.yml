name: Release SAM.gov native Worker

# SAM native Worker only. The sam-gov/v* family separately publishes Python.
# No container build, package publishing, or deploy/services.json matrix.
on:
  push:
    tags: ['sam-gov-hosted/v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-production-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cloudflare-production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Guard native release tag and reviewed commit
        id: tag
        shell: bash
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          python - <<'PY'
          import os
          from pathlib import Path
          from scripts.verify_sam_native_release import release_version
          source = Path('deploy/sam-gov/src/index.ts').read_text()
          version = release_version(os.environ['GITHUB_REF'], source)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PY
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Verify native release gate
        run: |
          # Replay parity imports the local SAM implementation, without keys or network calls.
          python -m pip install pytest pyyaml 'mcp>=2.0.0a1,<3' 'httpx>=0.27.0' 'filelock>=3.13' 'platformdirs>=4.0'
          python -m pytest -q tests/test_sam_native_release.py tests/test_sam_loader.py tests/test_sam_entity_extract.py tests/test_sam_exclusion_extract.py tests/test_sam_public_loader.py tests/test_sam_public_incremental.py tests/test_sam_public_cost.py tests/test_sam_public_parity.py
      - name: Verify Worker and published tool contract
        working-directory: deploy/sam-gov
        run: |
          npm ci --ignore-scripts
          npm run check
          npm test
          npm run contract
          git diff --exit-code -- tools-contract.json
          npx wrangler deploy --dry-run --env production --var RELEASE_SHA:$GITHUB_SHA
      - name: Deploy SAM native Worker
        working-directory: deploy/sam-gov
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing Cloudflare deployment credential'; exit 1; }
          npx wrangler deploy --env production --var RELEASE_SHA:$GITHUB_SHA
      - name: Verify deployed SHA, six tools, and public extracts
        env:
          SAM_NATIVE_VERSION: ${{ steps.tag.outputs.version }}
        run: python scripts/verify_sam_native_release.py --sha "$GITHUB_SHA" --version "$SAM_NATIVE_VERSION" --output native-release-verification.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sam-gov-native-release-verification
          path: native-release-verification.json
          retention-days: 90
      - name: Publish verified native release
        env:
          GH_TOKEN: ${{ github.token }}
          SAM_NATIVE_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" native-release-verification.json --verify-tag --title "SAM.gov hosted $SAM_NATIVE_VERSION" --notes 'Native keyless Worker release. Deployment SHA, six-tool contract, extract metadata, and real entity/exclusion lookups verified before publication.'
