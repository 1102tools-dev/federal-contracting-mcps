name: SAM.gov hosted tests

on:
  pull_request:
    paths:
      - 'deploy/sam-gov/**'
      - 'deploy/shared/**'
      - 'scripts/load_sam_opportunities.py'
      - 'scripts/load_sam_public.py'
      - 'scripts/sam_*_extract.py'
      - 'scripts/verify_sam*.py'
      - 'tests/test_sam*.py'
      - 'tests/fixtures/sam_public/**'
      - '.github/workflows/sam-gov-hosted-tests.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/sam-gov/**'
      - 'deploy/shared/**'
      - 'scripts/load_sam_opportunities.py'
      - 'scripts/load_sam_public.py'
      - 'scripts/sam_*_extract.py'
      - 'scripts/verify_sam*.py'
      - 'tests/test_sam*.py'
      - 'tests/fixtures/sam_public/**'
      - '.github/workflows/sam-gov-hosted-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Loader
        run: uv run --python 3.12 --with pytest --with pyyaml --with 'mcp>=2.0.0a1,<3' --with httpx --with filelock --with platformdirs --prerelease allow pytest -q tests/test_sam_loader.py tests/test_sam_entity_extract.py tests/test_sam_exclusion_extract.py tests/test_sam_public_loader.py tests/test_sam_public_incremental.py tests/test_sam_public_cost.py tests/test_sam_public_parity.py tests/test_sam_native_release.py
      - name: Worker typecheck, tools, and contract
        working-directory: deploy/sam-gov
        run: |
          npm ci --ignore-scripts
          npm run check
          npm test
      - name: Deploy dry run
        working-directory: deploy/sam-gov
        run: npx wrangler deploy --dry-run --env production --outdir "$RUNNER_TEMP/sam-dist"
